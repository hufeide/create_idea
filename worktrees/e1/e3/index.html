<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather Card UI</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #e8f1ff 0%, #d9e8ff 100%);
      min-height: 100vh;
      padding: 28px 20px 48px;
    }
    .hero {
      max-width: 1100px;
      margin: 0 auto 22px;
    }
    .hero h1 { margin: 0 0 4px; font-size: 1.6rem; color: #16324d; }
    .hero p { margin: 0; color: #3e5a78; font-size: 0.95rem; }
    .wc-grid { max-width: 1100px; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Weather Card UI</h1>
    <p>Weather data rendered as friendly cards — sample data from <code>data/sample.json</code>.</p>
  </div>
  <main id="weather"></main>

  <script type="module">
    import { renderWeatherGridToElement } from '/src/weather-card.js';
    import data from '/data/sample.json';

    renderWeatherGridToElement(document.getElementById('weather'), data);
  </script>
</body>
</html>
