<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Idea 蛋 画布（SDK 版）</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#30363d;
    --txt:#c9d1d9; --muted:#8b949e; --accent:#7c5cff; --accent2:#22d3a6;
    --egg:#1b2030; --eggHead:#262d40; --danger:#f85149;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:-apple-system,Segoe UI,Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:6px;padding:6px 10px;font-size:12px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);}
  button:hover{border-color:var(--accent);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  button.danger{background:transparent;border-color:var(--danger);color:#f85149;}
  input,textarea,select{font-family:inherit;background:#0d1117;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;outline:none;}
  input:focus,textarea:focus,select:focus{border-color:var(--accent);}

  #topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:30;}
  #topbar .logo{font-weight:700;color:var(--accent);letter-spacing:.5px;}
  #topbar .spacer{flex:1;}
  #topbar .histmode{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);white-space:nowrap;}
  #topbar .histmode select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:11px;}
  #goal{width:280px;}
  #status{font-size:11px;color:var(--muted);}

  #stage{position:absolute;top:53px;left:0;right:0;bottom:0;overflow:hidden;background:
     radial-gradient(circle at 1px 1px, #1b2230 1px, transparent 0) 0 0/24px 24px;}
  #world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;}
  #edges{position:absolute;left:0;top:0;width:8000px;height:6000px;overflow:visible;pointer-events:none;}
  #edges path.edge{pointer-events:stroke;stroke:#52607a;stroke-width:2.5;fill:none;cursor:pointer;transition:stroke .15s;}
  #edges path.edge:hover{stroke:var(--accent);}
  #edges path.edge.sel{stroke:var(--accent2);stroke-dasharray:6 4;}
  #edges path.temp{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:5 4;fill:none;}

  .egg{position:absolute;width:320px;background:var(--egg);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.35);user-select:none;}
  .egg.sel{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(34,211,166,.35);}
  .egg .head{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--eggHead);border-radius:12px 12px 0 0;cursor:grab;}
  .egg .head.drag{cursor:grabbing;}
  .egg .title{background:transparent;border:none;color:#fff;font-weight:600;font-size:13px;flex:1;min-width:60px;padding:2px 4px;}
  .egg .badge{font-size:10px;padding:2px 6px;border-radius:10px;background:rgba(124,92,255,.2);color:#b9a6ff;border:1px solid rgba(124,92,255,.4);white-space:nowrap;}
  .egg .chk{width:14px;height:14px;accent-color:var(--accent2);cursor:pointer;}
  .egg .x{background:transparent;border:none;color:var(--muted);font-size:14px;padding:0 2px;}
  .egg .x:hover{color:#f85149;border:none;}

  .egg .body{padding:10px;display:flex;flex-direction:column;gap:8px;}
  .egg .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .egg textarea.prompt{width:100%;height:54px;resize:vertical;line-height:1.4;}
  .egg .msgs{height:140px;overflow:auto;background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;}
  .egg .msg{font-size:12px;line-height:1.45;padding:6px 8px;border-radius:8px;max-width:95%;}
  .egg .msg .who{display:block;font-size:9px;color:var(--muted);margin-bottom:2px;}
  .egg .msg .body{white-space:pre-wrap;word-break:break-word;}
  .egg .msg.user{background:rgba(124,92,255,.18);align-self:flex-end;border:1px solid rgba(124,92,255,.35);}
  .egg .msg.assistant{background:rgba(34,211,166,.12);align-self:flex-start;border:1px solid rgba(34,211,166,.3);}
  .egg .msg.system{background:rgba(210,153,34,.12);align-self:center;border:1px solid rgba(210,153,34,.3);color:#e3c07a;font-size:11px;}
  .egg .cmdrow{display:flex;gap:6px;}
  .egg .cmdrow input{flex:1;}
  .egg .cmdrow button.send{flex:0 0 auto;}
  .egg .cmdrow button.send.stop{width:34px;height:34px;padding:0;background:#c0392b;border-color:#c0392b;color:#fff;font-size:15px;line-height:1;}
  .egg .cmdrow button.send:disabled{opacity:.5;cursor:not-allowed;}
  .egg .st{font-size:10px;padding:2px 7px;border-radius:10px;border:1px solid var(--line);white-space:nowrap;}
  .egg .st.idle{color:#8b98a9;background:#12161f;}
  .egg .st.plan{color:#e3c07a;background:#2a2410;border-color:#5a4a1a;}
  .egg .st.intr{color:#ff9b95;background:#2a1414;border-color:#7a2b2b;}
  .egg .st.run{color:#7fe9c9;background:#0f2a22;border-color:#1f6b56;}
  .egg.running{border-color:var(--accent);box-shadow:0 0 0 2px rgba(124,92,255,.35);}
  .egg .acts{display:flex;flex-wrap:wrap;gap:6px;}
  .egg .acts button{flex:1;min-width:64px;}

  .port{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--panel2);border:2px solid var(--accent);top:14px;cursor:crosshair;z-index:5;}
  .port.in{left:-8px;}
  .port.out{right:-8px;border-color:var(--accent2);}
  .port.out:hover{background:var(--accent2);}

  #commander{position:absolute;top:53px;right:0;bottom:0;width:340px;background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;z-index:25;}
  #commander.open{transform:translateX(0);}
  #commander .c-head{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;display:flex;align-items:center;gap:8px;}
  #commander .c-head .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);box-shadow:0 0 8px var(--accent2);}
  #commander .c-body{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;}
  #commander .c-msg{font-size:12px;line-height:1.5;padding:8px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);}
  #commander .c-foot{padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;}
  #commander select{width:100%;}

  #modal{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:40;}
  #modal.open{display:flex;}
  #modal .box{width:680px;max-width:92vw;max-height:84vh;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;}
  #modal .m-head{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:600;}
  #modal .m-head .x{margin-left:auto;background:transparent;border:none;color:var(--muted);font-size:16px;}
  #modal .m-body{flex:1;overflow:auto;display:flex;}
  #modal .tree{width:200px;border-right:1px solid var(--line);padding:8px;font-size:12px;}
  #modal .tree .f{padding:4px 6px;border-radius:6px;cursor:pointer;color:var(--muted);word-break:break-all;}
  #modal .tree .f:hover{background:var(--panel2);color:var(--txt);}
  #modal .tree .f.active{background:var(--accent);color:#fff;}
  #modal pre{margin:0;padding:14px;flex:1;overflow:auto;font-size:12px;line-height:1.5;color:#c9d1d9;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;}

  #help{position:absolute;left:12px;bottom:12px;background:rgba(22,27,34,.9);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:11px;color:var(--muted);max-width:260px;line-height:1.6;z-index:20;}
  #help b{color:var(--txt);}
  #zoomctl{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;z-index:20;}
  #zoomctl button{width:32px;height:32px;font-size:16px;}
  #toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .25s;z-index:50;pointer-events:none;}
  #toast.show{opacity:1;}

  #traceModal{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:45;}
  #traceModal.open{display:flex;}
  #traceModal .box{width:740px;max-width:94vw;max-height:86vh;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;}
  #traceModal .m-head{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:600;}
  #traceModal .m-head .x{margin-left:auto;background:transparent;border:none;color:var(--muted);font-size:16px;}
  #traceModal .m-head .rf{font-size:11px;color:var(--muted);}
  #traceModal .m-body{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;}
  #traceModal .tabs{display:flex;gap:6px;padding:8px 12px 0;overflow-x:auto;border-bottom:1px solid var(--line);}
  #traceModal .ttab{flex:0 0 auto;background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;padding:6px 10px;font-size:11px;white-space:nowrap;cursor:pointer;}
  #traceModal .ttab:hover{color:var(--txt);}
  #traceModal .ttab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  #traceModal .ttab .k{font-size:9px;opacity:.8;margin-left:4px;}
  .trace-item{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#0d1117;}
  .trace-item .th{display:flex;gap:8px;align-items:center;font-size:10px;color:var(--muted);margin-bottom:4px;}
  .trace-item .role{font-weight:600;}
  .trace-item .role.user{color:#b9a6ff;}
  .trace-item .role.assistant{color:#7fe9c9;}
  .trace-item .role.tool{color:#e3c07a;}
  .trace-item .role.system{color:#ff9b95;}
  .trace-item .kind{padding:1px 6px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);}
  .trace-item .content{font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
  .trace-item .content.prompt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;background:#0a0e14;border:1px solid #1b2230;border-radius:6px;padding:8px;color:#cdd6e4;}
  .trace-item .content.thought{color:#b9a6ff;font-style:italic;background:#12101c;border:1px solid #2a2540;border-radius:6px;padding:6px;}
  .trace-item.tcollapsed .content.thought{display:none;}
  .trace-item .ttoggle{cursor:pointer;}
  .trace-item .args{font-size:11px;color:var(--muted);margin-top:5px;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;background:#11161f;border:1px solid var(--line);border-radius:6px;padding:6px;}
  .trace-item .empty{color:var(--muted);text-align:center;padding:20px;font-size:12px;}
</style>
</head>
<body>
  <div id="topbar">
    <span class="logo">◓ IdeaCanvas</span>
    <input id="goal" placeholder="输入目标，例如：做一个天气查询机器人" />
    <button class="primary" id="genBtn">⚡ 生成 idea 蛋</button>
    <button id="addBtn">＋ 手动加蛋</button>
    <button id="combineBtn">🧩 组合选中蛋</button>
    <button id="runBtn" class="primary">▶ 一键运行选中蛋</button>
    <button id="delEdgeBtn" class="danger">✂ 删除选中连线</button>
    <button id="clearBtn">🗑 清空</button>
    <label class="histmode" title="子蛋/总指挥继承上/选中蛋会话时的历史范围">历史范围
      <select id="histMode">
        <option value="brief" selected>用户+助手</option>
        <option value="full">全部历史</option>
      </select>
    </label>
    <label class="histmode" title="捕获并流式展示本地模型的思考过程（reasoning；SDK 默认丢弃，需额外调用一次）"><input type="checkbox" id="reasonChk"/> 💭思考</label>
    <span class="spacer"></span>
    <span id="status">连接中…</span>
    <button id="cmdBtn">🎯 总指挥</button>
  </div>

  <div id="stage">
    <div id="world">
      <svg id="edges"></svg>
    </div>
  </div>

  <div id="commander">
    <div class="c-head"><span class="dot"></span>总指挥 · Commander <button id="cmdTrace" class="primary" style="margin-left:auto;padding:3px 8px;font-size:11px;">📜 轨迹</button></div>
    <div class="c-body" id="cmdBody">
      <div class="c-msg"><b>总指挥已就位。</b><br/>在下方下达协调指令，例如「让『数据获取』与『展示』对齐字段」。只有用户连线相连的蛋才会互通消息。</div>
    </div>
    <div class="c-foot">
      <select id="cmdTarget"></select>
      <textarea id="cmdInput" rows="2" placeholder="向总指挥下达指令…（勾选蛋后，总指挥将直接指挥它们完成）"></textarea>
      <button class="primary" id="cmdSend">发送协调指令</button>
    </div>
  </div>

  <div id="modal">
    <div class="box">
      <div class="m-head"><span id="modalTitle">审阅代码</span><button class="x" id="modalX">✕</button></div>
      <div class="m-body">
        <div class="tree" id="modalTree"></div>
        <pre id="modalCode"></pre>
      </div>
    </div>
  </div>

  <div id="traceModal">
    <div class="box">
      <div class="m-head"><span id="traceTitle">全局对话轨迹</span><span class="rf" id="traceConn"></span><button class="x" id="traceX">✕</button></div>
      <div class="tabs" id="traceTabs"></div>
      <div class="m-body" id="traceBody"></div>
    </div>
  </div>

  <div id="help">
    <b>操作提示</b><br/>
    • 拖拽蛋的<b>标题栏</b>移动<br/>
    • 从蛋<b>右侧圆点</b>拖到另一蛋连线<br/>
    • 双击连线可<b>删除</b><br/>
    • 勾选蛋上的☑后点「组合选中蛋」<br/>
    • 拖动空白处可<b>平移</b>画布
  </div>
  <div id="zoomctl">
    <button id="zoomIn">＋</button>
    <button id="zoomOut">－</button>
    <button id="zoomReset">⤢</button>
  </div>
  <div id="toast"></div>

<script>
const EGG_W = 320, PORT_Y = 21;
const $ = s => document.querySelector(s);
const stage = $('#stage'), world = $('#world'), svg = $('#edges');

const state = {
  eggs: {}, edges: [], selectedEdge: null,
  connecting: null, draggingEgg: null, panning: null,
};
let tx = 60, ty = 40, scale = 1;
const activeStream = {};   // eggId -> streaming body element

/* ---------- utils ---------- */
function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }
function applyWorld(){ world.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; }
function screenToWorld(cx, cy){ const r=stage.getBoundingClientRect(); return { x:(cx-r.left-tx)/scale, y:(cy-r.top-ty)/scale }; }
function edgePath(x1,y1,x2,y2){ const c=Math.max(40,Math.abs(x2-x1)/2); return `M ${x1} ${y1} C ${x1+c} ${y1}, ${x2-c} ${y2}, ${x2} ${y2}`; }

/* ---------- websocket ---------- */
let ws;
function connect(){
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = ()=>{ $('#status').textContent='已连接'; ws.send(JSON.stringify({type:'sync'})); };
  ws.onclose = ()=>{ $('#status').textContent='断开，重连中…'; setTimeout(connect, 1500); };
  ws.onmessage = ev => handle(JSON.parse(ev.data));
}
function send(obj){ if(ws && ws.readyState===1) ws.send(JSON.stringify(obj)); }

function handle(m){
  switch(m.type){
    case 'eggs': syncGraph(m.eggs, m.edges); if(m.history_mode) $('#histMode').value=m.history_mode; if(m.reasoning) $('#reasonChk').checked=!!m.reasoning.enabled; break;
    case 'historyMode': $('#histMode').value=m.mode; break;
    case 'reasoning': $('#reasonChk').checked=!!m.enabled; break;
    case 'token': appendToken(m.eggId, m.text); if(traceKey===m.eggId) refreshTraceThrottled(); break;
    case 'msg': { const e=state.eggs[m.eggId]; if(e) pushMsg(e, m.role||'user', m.text); break; }
    case 'status': { const e=state.eggs[m.eggId]; if(e) setEggStatus(e, m.status); break; }
    case 'done': { delete activeStream[m.eggId]; const e=state.eggs[m.eggId]; if(e) setEggStatus(e,'idle'); if(traceKey===m.eggId) fetchTrace(m.eggId); break; }
    case 'system': { const e=state.eggs[m.eggId]; if(e) pushMsg(e,'system',m.text); if(traceKey===m.eggId) fetchTrace(m.eggId); break; }
    case 'compressed': { const e=state.eggs[m.eggId]; if(e){ e.messages=[]; pushMsg(e,'system',m.summary); setEggStatus(e,'idle'); } break; }
    case 'error': toast('错误: '+m.message); break;
  }
}

/* ---------- rendering ---------- */
/* The chat shows ONLY user + assistant (thinking/tool calls live in the 轨迹). */
function renderMsgs(egg){
  const box=egg.el.querySelector('.msgs'); box.innerHTML='';
  for(const msg of egg.messages){
    const d=document.createElement('div'); d.className='msg '+msg.role;
    const who = msg.role==='user'?'你':(msg.role==='assistant'?'LLM':'系统');
    d.innerHTML=`<span class="who">${who}</span><span class="body"></span>`;
    d.querySelector('.body').textContent=msg.content;
    box.appendChild(d);
  }
  box.scrollTop=box.scrollHeight;
}
function pushMsg(egg, role, content){
  egg.messages.push({role, content});
  renderMsgs(egg);
  return egg.el.querySelector('.msgs').lastElementChild.querySelector('.body');
}

function createEggEl(e){
  const el=document.createElement('div');
  el.className='egg'; el.dataset.id=e.id;
  el.style.left=e.x+'px'; el.style.top=e.y+'px';
  el.innerHTML=`
    <div class="port in" title="输入（仅相连的蛋可传入）"></div>
    <div class="port out" title="输出（从此拖出连线）"></div>
    <div class="head">
      <input type="checkbox" class="chk" title="选择以组合"/>
      <input class="title" value="${esc(e.title)}"/>
      <span class="badge">${e.type}</span>
      <span class="st idle">空闲</span>
      <button class="x" title="删除蛋">✕</button>
    </div>
    <div class="body">
      <div><div class="lbl">提示词（LLM 生成）</div>
        <textarea class="prompt" placeholder="描述该模块的提示词…">${esc(e.prompt)}</textarea></div>
      <div><div class="lbl">会话</div><div class="msgs"></div></div>
      <div class="cmdrow"><input class="cmd" placeholder="向该蛋的 LLM 发送命令…"/><button class="primary send">发送</button></div>
      <div class="acts">
        <button class="compress">🗜 压缩会话</button>
        <button class="review">👁 审阅代码</button>
        <button class="trace">📜 轨迹</button>
      </div>
    </div>`;
  world.appendChild(el);
  const egg={id:e.id,title:e.title,prompt:e.prompt,type:e.type,x:e.x,y:e.y,parent:e.parent||null,el,selected:false,messages:[]};
  state.eggs[e.id]=egg;

  el.querySelector('.title').addEventListener('input', ev=> egg.title=ev.target.value);
  el.querySelector('.prompt').addEventListener('input', ev=> egg.prompt=ev.target.value);
  el.querySelector('.chk').addEventListener('change', ev=>{ egg.selected=ev.target.checked; el.classList.toggle('sel', egg.selected); });
  el.querySelector('.x').addEventListener('click', ()=> send({type:'deleteEgg', id:egg.id}));

  const head=el.querySelector('.head');
  head.addEventListener('mousedown', ev=>{
    if(ev.target.closest('input,button,.port')) return;
    const w=screenToWorld(ev.clientX,ev.clientY);
    state.draggingEgg={id:egg.id, offX:w.x-egg.x, offY:w.y-egg.y};
    head.classList.add('drag'); ev.preventDefault();
  });
  el.querySelector('.port.out').addEventListener('mousedown', ev=>{
    ev.stopPropagation();
    const w=screenToWorld(ev.clientX,ev.clientY);
    state.connecting={from:egg.id, x:w.x, y:w.y}; ev.preventDefault();
  });

  const cmd=el.querySelector('.cmd');
  const doSend=()=>{
    if(egg.running){ interruptEgg(egg); return; }   // running -> stop button interrupts
    const t=cmd.value.trim();
    const text=t || egg.prompt;   // empty command -> send the egg's prompt
    if(text) sendCommand(egg, text);
  };
  el.querySelector('.send').addEventListener('click', doSend);
  cmd.addEventListener('keydown', ev=>{ if(ev.key==='Enter' && !egg.running) doSend(); });
  el.querySelector('.compress').addEventListener('click', ()=>{
    if(egg.running || egg.planned) return;        // already busy
    setEggStatus(egg, 'running');                 // 状态 -> 运行中
    pushMsg(egg, 'system', '🗜 正在压缩会话…');     // 会话 -> 正在压缩
    send({type:'compress', eggId:egg.id});
  });
  el.querySelector('.review').addEventListener('click', ()=> openReview(egg));
  el.querySelector('.trace').addEventListener('click', ()=> openTrace(egg.id));

  renderMsgs(egg);
  setEggStatus(egg, 'idle');
}

/* Reflect an egg's run state on its box: 空闲 / 计划中 / 运行中.
   While running, the send button becomes a square stop (⏹) that interrupts. */
function setEggStatus(egg, status){
  egg.running = (status==='running');
  egg.planned = (status==='planned');
  const btn=egg.el.querySelector('.send');
  const badge=egg.el.querySelector('.st');
  const label = status==='running' ? '运行中' : (status==='planned' ? '计划中' : (status==='interrupting' ? '打断中…' : '空闲'));
  const cls = status==='running' ? 'run' : (status==='planned' ? 'plan' : (status==='interrupting' ? 'intr' : 'idle'));
  if(badge){ badge.textContent=label; badge.className='st '+cls; }
  egg.el.classList.toggle('running', status==='running');
  if(btn){
    btn.classList.toggle('stop', status==='running' || status==='interrupting');
    btn.disabled = (status==='planned' || status==='interrupting');
    btn.textContent = (status==='running' || status==='interrupting') ? '⏹' : '发送';
    btn.title = status==='running' ? '打断运行' : (status==='planned' ? '计划中，等待运行' : (status==='interrupting' ? '正在打断…' : '发送命令（空则发送提示词）'));
  }
}
function interruptEgg(egg){
  setEggStatus(egg, 'interrupting');   // immediate visual feedback
  fetch('/api/interrupt?egg_id='+encodeURIComponent(egg.id), {method:'POST'})
    .then(r=>r.ok?r.json():{})
    .then(j=>{ if(j && j.busy===false) setEggStatus(egg,'idle'); })
    .catch(()=>{});
  // Safety net: the backend also emits status/done over WS; if nothing arrives, reset.
  setTimeout(()=>{
    const b=egg.el.querySelector('.st');
    if(b && b.classList.contains('intr')) setEggStatus(egg,'idle');
  }, 5000);
}

function syncGraph(eggs, edges){
  const present=new Set(eggs.map(e=>e.id));
  for(const id of Object.keys(state.eggs)){
    if(!present.has(id)){ state.eggs[id].el.remove(); delete state.eggs[id]; }
  }
  for(const e of eggs){
    const ex=state.eggs[e.id];
    if(ex){
      ex.title=e.title; ex.prompt=e.prompt; ex.type=e.type; ex.x=e.x; ex.y=e.y; ex.parent=e.parent||null;
      ex.el.style.left=e.x+'px'; ex.el.style.top=e.y+'px';
      ex.el.querySelector('.title').value=e.title;
      ex.el.querySelector('.prompt').value=e.prompt;
      ex.el.querySelector('.badge').textContent=e.type;
    } else {
      createEggEl(e);
    }
  }
  state.edges=edges||[];
  refreshCmdTargets();
  updateEdges();
}

function updateEdges(){
  svg.innerHTML='';
  for(const ed of state.edges){
    const a=state.eggs[ed.from], b=state.eggs[ed.to];
    if(!a||!b) continue;
    const p1={x:a.x+EGG_W, y:a.y+PORT_Y}, p2={x:b.x, y:b.y+PORT_Y};
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', edgePath(p1.x,p1.y,p2.x,p2.y));
    path.setAttribute('class','edge'+(state.selectedEdge===ed.id?' sel':''));
    path.addEventListener('click', ()=>{ state.selectedEdge=(state.selectedEdge===ed.id?null:ed.id); updateEdges(); });
    path.addEventListener('dblclick', ()=> send({type:'deleteEdge', id:ed.id}));
    svg.appendChild(path);
  }
  if(state.connecting){
    const a=state.eggs[state.connecting.from];
    if(a){
      const p1={x:a.x+EGG_W, y:a.y+PORT_Y};
      const t=document.createElementNS('http://www.w3.org/2000/svg','path');
      t.setAttribute('d', edgePath(p1.x,p1.y,state.connecting.x,state.connecting.y));
      t.setAttribute('class','temp');
      svg.appendChild(t);
    }
  }
}

/* ---------- streaming tokens ---------- */
/* The chat (界面) shows ONLY user + assistant messages. 💭思考 / 🔧工具调用 are
   recorded in the backend transcript and shown in the 轨迹 (trace) instead — so
   here we simply skip those streamed tokens. */
function appendToken(eggId, text){
  if(typeof text==='string' &&
     (text.startsWith('💭') || text.trimStart().startsWith('🔧') || text.trimStart().startsWith('↳'))){
    return;
  }
  let body=activeStream[eggId];
  if(!body){
    if(eggId==='commander'){
      const d=document.createElement('div'); d.className='c-msg';
      d.innerHTML='<b>总指挥：</b><span class="b"></span>';
      $('#cmdBody').appendChild(d); body=d.querySelector('.b');
    } else {
      const egg=state.eggs[eggId]; if(!egg) return;
      egg.messages.push({role:'assistant', content:''});
      renderMsgs(egg);
      body=egg.el.querySelector('.msgs').lastElementChild.querySelector('.body');
    }
    activeStream[eggId]=body;
  }
  body.textContent += text;
  if(eggId==='commander'){ $('#cmdBody').scrollTop=$('#cmdBody').scrollHeight; }
  else { const b=state.eggs[eggId].el.querySelector('.msgs'); b.scrollTop=b.scrollHeight; }
}

function sendCommand(egg, text){
  pushMsg(egg,'user',text);
  egg.el.querySelector('.cmd').value='';
  setEggStatus(egg,'running');
  send({type:'command', eggId:egg.id, text});
}

/* ---------- commander ---------- */
function refreshCmdTargets(){
  const sel=$('#cmdTarget'); const cur=sel.value;
  sel.innerHTML='<option value="">— 全局协调 —</option>';
  for(const e of Object.values(state.eggs)){ const o=document.createElement('option'); o.value=e.id; o.textContent='蛋：'+e.title; sel.appendChild(o); }
  sel.value=cur;
}
$('#cmdSend').addEventListener('click', ()=>{
  const txt=$('#cmdInput').value.trim(); if(!txt) return;
  const targets=Object.values(state.eggs).filter(e=>e.selected).map(e=>e.id);
  const target=$('#cmdTarget').value;
  const d=document.createElement('div'); d.className='c-msg';
  const scope = targets.length
    ? `（将指挥 ${targets.length} 个选中蛋）`
    : (target ? '（单一目标蛋）' : '（全局协调建议）');
  d.innerHTML=`<b>你 → 总指挥：</b>${esc(scope)}<br/>${esc(txt)}`;
  $('#cmdBody').appendChild(d); $('#cmdBody').scrollTop=$('#cmdBody').scrollHeight;
  $('#cmdInput').value='';
  send({type:'commander', text:txt, target, targets});
});

/* ---------- review code (worktree) ---------- */
async function openReview(egg){
  $('#modalTitle').textContent='审阅代码 · '+egg.title+'（worktree）';
  const tree=$('#modalTree'), code=$('#modalCode');
  tree.innerHTML='加载中…'; code.textContent='';
  const res=await fetch(`/api/egg/${egg.id}/files`);
  const data=await res.json();
  tree.innerHTML='';
  if(!data.files.length){ tree.innerHTML='<div class="f">（空 worktree）</div>'; }
  data.files.forEach(f=>{
    const d=document.createElement('div'); d.className='f'; d.textContent=f;
    d.addEventListener('click', async ()=>{
      [...tree.children].forEach(c=>c.classList.remove('active')); d.classList.add('active');
      const r=await fetch(`/api/egg/${egg.id}/file?path=${encodeURIComponent(f)}`);
      const j=await r.json();
      code.textContent=j.content||'';
    });
    tree.appendChild(d);
  });
  $('#modal').classList.add('open');
}
$('#modalX').addEventListener('click', ()=> $('#modal').classList.remove('open'));
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') $('#modal').classList.remove('open'); });

/* ---------- topbar actions ---------- */
$('#genBtn').addEventListener('click', ()=>{ const g=$('#goal').value.trim()||'构建一个智能应用'; send({type:'generate', goal:g}); });
$('#addBtn').addEventListener('click', ()=> send({type:'addEgg', title:'新蛋'}));
$('#combineBtn').addEventListener('click', ()=>{
  const ids=Object.values(state.eggs).filter(e=>e.selected).map(e=>e.id);
  if(!ids.length){ toast('请先勾选要组合的蛋'); return; }
  send({type:'combine', ids});
});
$('#runBtn').addEventListener('click', ()=>{
  const ids=Object.values(state.eggs).filter(e=>e.selected).map(e=>e.id);
  if(!ids.length){ toast('请先勾选要运行的蛋'); return; }
  $('#commander').classList.add('open');   // show the parallel/serial schedule
  send({type:'run', targets:ids});
});
$('#delEdgeBtn').addEventListener('click', ()=>{
  if(!state.selectedEdge){ toast('请先点选一条连线'); return; }
  send({type:'deleteEdge', id:state.selectedEdge}); state.selectedEdge=null;
});
$('#clearBtn').addEventListener('click', ()=>{
  if(!confirm('清空整个画布？')) return;
  for(const id of Object.keys(state.eggs)) send({type:'deleteEgg', id});
});
$('#cmdBtn').addEventListener('click', ()=> $('#commander').classList.toggle('open'));

/* ---------- history range (how much session history is inherited) ---------- */
$('#histMode').addEventListener('change', ev=>{
  const mode=ev.target.value;
  send({type:'setHistoryMode', mode});
  toast(mode==='full' ? '历史范围：全部历史（含思考/工具）' : '历史范围：仅用户+助手');
});
$('#reasonChk').addEventListener('change', ev=>{
  send({type:'setReasoning', on: ev.target.checked});
  toast(ev.target.checked ? '💭思考：开（将额外流式捕获 reasoning）' : '💭思考：关');
});

/* ---------- trace (conversation records, time-ordered) ---------- */
let traceKey = null, traceTimer = null, _traceLast = 0;
function traceURL(key){ return key==='commander' ? '/api/trace/commander' : `/api/trace/${key}`; }
function refreshTraceThrottled(){
  const now=Date.now();
  if(now-_traceLast>=500){ _traceLast=now; if(traceKey) fetchTrace(traceKey); }
}
async function fetchTrace(key){
  if(!key) return;
  try{
    const r=await fetch(traceURL(key));
    if(r.ok) renderTrace(await r.json(), key);
  }catch(e){}
}
function renderTrace(data, key){
  const label = key==='commander' ? '总指挥' : (data.title || key);
  $('#traceTitle').textContent = '对话轨迹 · ' + label;
  $('#traceConn').textContent = data.connected ? '● 已连接模型' : '○ 未连接模型';
  const body=$('#traceBody'); body.innerHTML='';
  const list=data.transcript||[];
  if(!list.length){
    body.innerHTML='<div class="trace-item"><div class="empty">暂无对话记录。向该蛋发送命令后，这里会按时间顺序显示：用户指令、模型回复、思考（💭）与工具调用/结果。</div></div>';
    return;
  }
  for(let idx=0; idx<list.length; idx++){
    const it=list[idx];
    const div=document.createElement('div');
    div.className='trace-item';                  // thoughts start EXPANDED in the trace
    const ts=(it.ts||'').split('T')[1] || it.ts || '';
    const KIND_LABEL={user:'用户',system:'系统',assistant:'模型',tool:'工具',thought:'思考',tool_call:'工具调用',tool_result:'工具结果',system_prompt:'系统提示词',tools:'可用工具',prompt:'发送提示词',plan:'指挥计划',status:'状态'};
    const kindLabel = KIND_LABEL[it.kind] || it.kind;
    const roleCls = it.role==='user'?'user':(it.role==='assistant'?'assistant':(it.role==='tool'?'tool':'system'));
    let head = `<span class="role ${roleCls}">${it.role}</span><span class="kind">${esc(kindLabel)}</span>`;
    if(it.name) head += `<span class="kind">${esc(it.name)}</span>`;
    if(it.kind==='thought') head += `<span class="kind ttoggle">▾ 折叠</span>`;
    head += `<span style="margin-left:auto;">${esc(ts)}</span>`;
    const isPrompt = it.kind==='system_prompt' || it.kind==='prompt' || it.kind==='tools' || it.kind==='plan';
    const isThought = it.kind==='thought';
    let content = it.text!=null ? `<div class="content${isPrompt?' prompt':''}${isThought?' thought':''}">${isThought?'💭 ':''}${esc(it.text)}</div>` : '';
    let extra='';
    if(it.kind==='tool_call' && it.args!=null){
      extra=`<div class="args">参数：${esc(JSON.stringify(it.args,null,2))}</div>`;
    } else if(it.kind==='tool_result'){
      const rr = it.error!=null ? ('错误：'+it.error) : (it.result!=null ? JSON.stringify(it.result,null,2) : '');
      if(rr) extra=`<div class="args">${esc(rr)}</div>`;
    }
    div.innerHTML = `<div class="th">${head}</div>${content}${extra}`;
    if(isThought){
      div.style.cursor='pointer';
      const toggle=div.querySelector('.ttoggle');
      div.addEventListener('click', ()=>{
        div.classList.toggle('tcollapsed');
        if(toggle) toggle.textContent = div.classList.contains('tcollapsed') ? '▸ 展开' : '▾ 折叠';
      });
    }
    body.appendChild(div);
  }
  body.scrollTop=body.scrollHeight;
}
/* Build the tab bar: 总指挥 + every egg (idea / sub), clickable to switch. */
function buildTraceTabs(active){
  const bar=$('#traceTabs'); bar.innerHTML='';
  const tabs=[{key:'commander', label:'总指挥', kind:'commander'}];
  for(const e of Object.values(state.eggs)){
    tabs.push({key:e.id, label:(e.parent?('↳ '+e.title):e.title), kind:e.type, parent:e.parent});
  }
  for(const t of tabs){
    const b=document.createElement('button');
    b.className='ttab'+(t.key===active?' active':'');
    b.dataset.key=t.key;
    const klabel = t.kind==='idea' ? 'idea' : (t.kind==='commander' ? '指挥' : '子蛋');
    b.innerHTML = `${esc(t.label)}<span class="k">${klabel}</span>`;
    b.addEventListener('click', ()=> selectTraceTab(t.key));
    bar.appendChild(b);
  }
}
function selectTraceTab(key){
  traceKey=key;
  [...$('#traceTabs').children].forEach(b=> b.classList.toggle('active', b.dataset.key===key));
  fetchTrace(key);
}
function openTrace(key){
  traceKey=key;
  $('#traceModal').classList.add('open');
  buildTraceTabs(key);
  selectTraceTab(key);
  if(traceTimer) clearInterval(traceTimer);
  traceTimer=setInterval(()=>{ if(traceKey) fetchTrace(traceKey); }, 1500);
}
function closeTrace(){
  $('#traceModal').classList.remove('open');
  traceKey=null;
  if(traceTimer){ clearInterval(traceTimer); traceTimer=null; }
}
$('#cmdTrace').addEventListener('click', ()=> openTrace('commander'));
$('#traceX').addEventListener('click', closeTrace);
$('#traceModal').addEventListener('click', e=>{ if(e.target.id==='traceModal') closeTrace(); });

/* ---------- zoom / pan / drag ---------- */
$('#zoomIn').addEventListener('click', ()=>{ scale=Math.min(2,scale*1.1); applyWorld(); });
$('#zoomOut').addEventListener('click', ()=>{ scale=Math.max(0.4,scale/1.1); applyWorld(); });
$('#zoomReset').addEventListener('click', ()=>{ tx=60;ty=40;scale=1;applyWorld(); });

stage.addEventListener('mousedown', e=>{
  if(e.target===stage || e.target===world){ state.panning={sx:e.clientX, sy:e.clientY, tx, ty}; }
});
window.addEventListener('mousemove', e=>{
  if(state.panning){ tx=state.panning.tx+(e.clientX-state.panning.sx); ty=state.panning.ty+(e.clientY-state.panning.sy); applyWorld(); return; }
  if(state.draggingEgg){
    const w=screenToWorld(e.clientX,e.clientY); const egg=state.eggs[state.draggingEgg.id];
    egg.x=Math.round(w.x-state.draggingEgg.offX); egg.y=Math.round(w.y-state.draggingEgg.offY);
    egg.el.style.left=egg.x+'px'; egg.el.style.top=egg.y+'px'; updateEdges(); return;
  }
  if(state.connecting){ const w=screenToWorld(e.clientX,e.clientY); state.connecting.x=w.x; state.connecting.y=w.y; updateEdges(); return; }
});
window.addEventListener('mouseup', e=>{
  if(state.draggingEgg){
    const egg=state.eggs[state.draggingEgg.id];
    send({type:'move', id:egg.id, x:egg.x, y:egg.y});
    state.draggingEgg=null; document.querySelectorAll('.egg .head.drag').forEach(h=>h.classList.remove('drag'));
  }
  if(state.panning) state.panning=null;
  if(state.connecting){
    const w=screenToWorld(e.clientX,e.clientY); let target=null;
    for(const egg of Object.values(state.eggs)){
      if(egg.id===state.connecting.from) continue;
      if(w.x>=egg.x && w.x<=egg.x+EGG_W && w.y>=egg.y && w.y<=egg.y+260){ target=egg.id; break; }
    }
    if(target) send({type:'addEdge', from:state.connecting.from, to:target});
    state.connecting=null; updateEdges();
  }
});

connect();
applyWorld();
</script>
